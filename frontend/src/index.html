<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PokeRol</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A multilingual Pokédex." />
    <meta name="theme-color" content="#d93a3a" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Apply the persisted theme before first paint (key must match ThemeService). -->
    <script>
      try {
        var theme = localStorage.getItem('pokerol.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=JetBrains+Mono:wght@500&family=Nunito+Sans:wght@400;600;700&display=swap"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
