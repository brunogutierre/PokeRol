# Test overrides, loaded on top of the main application.yml. Tests never reach the real
# PokeAPI: nothing listens on port 9, and the index is not loaded at startup.
pokeapi:
  base-url: http://localhost:9/api/v2
  graphql-url: http://localhost:9/graphql
  max-retries: 0

app:
  index:
    warm-up: false
